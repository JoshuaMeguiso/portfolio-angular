<section id="skills" class="section-band border-b border-black/10 pb-8">
  <div class="container-page md:py-36">
    <app-section title="Skills">
      <!-- FILTER BUTTONS -->
      <div class="flex flex-wrap gap-2 mb-8">
        <button
          *ngFor="let cat of categories"
          (click)="setCategory(cat)"
          class="border border-black/20 px-3 py-1 text-xs transition"
          [ngClass]="{
            'bg-black text-white': activeCategory === cat,
            'bg-white text-black/60 hover:bg-[#f5c542]': activeCategory !== cat,
          }"
        >
          {{ cat }}
        </button>
      </div>

      <!-- GROUPED SKILLS -->
      <div class="space-y-10">
        <ng-container *ngFor="let group of groupedSkills()">
          <div>
            <h3 class="eyebrow mb-4">
              {{ group.category }}
            </h3>

            <div class="grid md:grid-cols-2 gap-4">
              <div
                *ngFor="let skill of group.skills"
                class="card flex items-center justify-between p-4 transition hover:-translate-y-1"
              >
                <!-- LEFT -->
                <div class="flex items-center gap-3">
                  <i [class]="skill.iconClass + ' text-xl'"></i>

                  <div>
                    <p class="text-sm font-medium text-black">
                      {{ skill.name }}
                    </p>

                    <p class="text-xs text-black/45">
                      {{ skill.level >= 80 ? 'Core strength' : skill.level >= 60 ? 'Working knowledge' : 'Familiarity' }}
                    </p>
                  </div>
                </div>

                <!-- RIGHT PROGRESS -->
                <div class="w-32">
                  <div class="w-full h-1 bg-black/10 overflow-hidden">
                    <div
                      class="h-1 bg-[#f5c542] transition-all duration-700"
                      [style.width.%]="(skill.level / skill.maxLevel) * 100"
                    ></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </ng-container>
      </div>
    </app-section>
  </div>
</section>
