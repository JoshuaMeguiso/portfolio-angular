<a
  class="project-card card card-hover group block h-full p-6"
  [routerLink]="['/projects', project.slug]"
  [attr.aria-label]="'View case study: ' + project.title"
>
  <div class="flex items-start justify-between gap-4 mb-3">
    <h3 class="text-lg font-semibold leading-snug text-black">
      {{ project.title }}
    </h3>
    <span aria-hidden="true" class="text-lg text-black/45 transition group-hover:translate-x-1 group-hover:text-black">→</span>
  </div>

  <p class="text-sm text-black/65 leading-relaxed mb-5">
    {{ project.description }}
  </p>

  <p *ngIf="project.impact.length" class="border-l-2 border-black/25 pl-3 text-sm text-black/75 leading-relaxed mb-5">
    {{ project.impact[0] }}
  </p>

  <div class="flex flex-wrap gap-2">
    <span class="skill-chip" *ngFor="let tech of project.tech">
      <i class="{{ tech.iconClass }} text-lg"></i>
      {{ tech.name }}
    </span>
  </div>
</a>
