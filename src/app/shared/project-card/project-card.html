<div class="card card-hover p-6 cursor-pointer" [routerLink]="['/projects', project.slug]">
  <h3 class="text-lg font-semibold mb-2">
    {{ project.title }}
  </h3>

  <p class="text-sm text-slate-600 leading-relaxed mb-4">
    {{ project.description }}
  </p>

  <div class="flex flex-wrap gap-2">
    <span class="skill-chip" *ngFor="let tech of project.tech">
      <i class="{{ tech.iconClass }} text-lg"></i>
      {{ tech.name }}
    </span>
  </div>
</div>
