<div class="container-page py-16 max-w-[900px]">
  <div class="mb-10">
    <h1 class="text-3xl font-bold mb-2">
      {{ project.title }}
    </h1>

    <p class="text-slate-600">
      {{ project.description }}
    </p>
  </div>

  <div class="space-y-8">
    <div class="card p-6">
      <app-section title="Overview">
        {{ project.overview }}
      </app-section>
    </div>

    <div class="card p-6">
      <app-section title="My Role">
        {{ project.role }}
      </app-section>
    </div>

    <div class="card p-6">
      <app-section title="Key Features">
        <ul class="list-disc pl-5 space-y-1">
          <li *ngFor="let f of project.features">
            {{ f }}
          </li>
        </ul>
      </app-section>
    </div>

    <!-- <div class="card p-6">
      <app-section title="Screenshots">
        <div class="space-y-8">
          <app-screenshot-block
            *ngFor="let s of project.screenshots"
            [image]="s.image"
            [caption]="s.caption"
          >
          </app-screenshot-block>
        </div>
      </app-section>
    </div> -->

    <div class="card p-6" *ngIf="project.links?.live || project.links?.github">
      <app-section title="Links">
        <div class="flex flex-col gap-2">

          <a
            *ngIf="project.links?.live"
            [href]="project.links.live"
            target="_blank"
            class="text-blue-600 hover:underline"
          >
            Live Demo
          </a>

          <a
            *ngIf="project.links?.github"
            [href]="project.links.github"
            target="_blank"
            class="text-slate-700 hover:underline"
          >
            GitHub Repository
          </a>

        </div>
      </app-section>
    </div>

    <div class="card p-6">
      <app-section title="Challenges & Solutions">
        <ul class="list-disc pl-5 space-y-1">
          <li *ngFor="let c of project.challenges">
            {{ c }}
          </li>
        </ul>
      </app-section>
    </div>
  </div>
</div>
